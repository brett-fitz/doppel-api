[project]
name = "doppel-api"
version = "0.1.0"
description = "Modern Python Doppel client — sync and async — powered by HTTPX"
authors = [{ name = "Brett Fitzpatrick", email = "brettfitz@protonmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.3"
keywords = ["doppel", "httpx", "async", "brand-protection", "doppel-api", "rest-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/brett-fitz/doppel-api"
Documentation = "https://github.com/brett-fitz/doppel-api#readme"
Repository = "https://github.com/brett-fitz/doppel-api"
Issues = "https://github.com/brett-fitz/doppel-api/issues"
Changelog = "https://github.com/brett-fitz/doppel-api/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
    "D",      # pydocstyle
]
ignore = [
    "D205",   # false positives on multi-line summary
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"scripts/**" = ["D103"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "integration: marks tests as integration tests requiring live API access",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["doppel"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

# ---------------------------------------------------------------------------
# ty
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Resource classes expose a public `list()` method which shadows the
# built-in `list` type within that class scope.  ty therefore rejects
# `list[str]` annotations on other methods in the same class as an invalid
# type expression.  Downgrade to a warning until ty handles this natively.
invalid-type-form = "warn"
